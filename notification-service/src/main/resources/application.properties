# Notification Service running on port 8083
server.port=8083
spring.application.name=notification-service

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Kafka Consumer Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=true
spring.kafka.consumer.properties.spring.json.type.mapping=checkoutEvent:com.bnpl.notification.event.CheckoutEvent,repaymentEvent:com.bnpl.notification.event.RepaymentEvent,com.bnpl.ledger.event.CheckoutEvent:com.bnpl.notification.event.CheckoutEvent,com.bnpl.ledger.event.RepaymentEvent:com.bnpl.notification.event.RepaymentEvent

# Twilio SMS Configuration
twilio.account-sid=${TWILIO_ACCOUNT_SID:your-account-sid}
twilio.auth-token=${TWILIO_AUTH_TOKEN:your-auth-token}
twilio.phone-number=${TWILIO_PHONE_NUMBER:+1234567890}
twilio.enabled=true
notification.default-phone=${NOTIFICATION_DEFAULT_PHONE:+919876543210}

# Logging Configuration
logging.level.com.bnpl=INFO
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN
