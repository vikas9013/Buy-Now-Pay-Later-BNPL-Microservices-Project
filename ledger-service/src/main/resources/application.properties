# Ledger Service running on port 8082
server.port=8082
spring.application.name=ledger-service

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Database configuration for Ledger Service
spring.datasource.url=jdbc:postgresql://localhost:5432/ledger_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:Vikas2005@}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# User Service URL for inter-service communication (Resolved dynamically via Eureka LoadBalancer)
user-service.url=http://USER-SERVICE

# Kafka Producer Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Logging Configuration
logging.level.com.bnpl=INFO
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN
spring.ai.openai.api-key=${OPENAI_API_KEY:dummy-key-for-now}

# Observability and Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
management.endpoints.web.exposure.include=*

# Payment Gateway Configuration (Razorpay & Stripe)
payment.gateway.mode=LIVE
