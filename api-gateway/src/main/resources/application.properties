# Spring Cloud API Gateway running on port 8080
server.port=8080
spring.application.name=api-gateway

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Dynamic Service Routing with Load Balancing
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**, /api/auth/**

spring.cloud.gateway.routes[1].id=ledger-service
spring.cloud.gateway.routes[1].uri=lb://LEDGER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/ledger/**
